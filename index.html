<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wittwo Travel Agency – Explore Banda Neira</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-navy: #0d2740;
            --deep-teal: #081a2b;
            --accent-green: #7d966d;
            --accent-yellow: #f0ab00;
            --light-teal: #1a3c5a;
            --soft-aqua: #2a5d84;
            --text-light: #f4f7f6;
            --text-muted: #a0b2c6;
            --card-bg: rgba(13, 39, 64, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--deep-teal);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .serif-font {
            font-family: 'Cormorant Garamond', serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- NAVIGATION --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: var(--transition);
            background: linear-gradient(to bottom, rgba(8, 26, 43, 0.9), transparent);
        }

        .navbar.scrolled {
            background: rgba(8, 26, 43, 0.95);
            padding: 15px 8%;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        .logo-text span.witt { color: #1a4f7c; }
        .logo-text span.wo { color: var(--accent-green); }

        .logo-tagline {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            display: block;
            margin-top: -5px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: var(--transition);
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent-yellow);
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--accent-yellow);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .mobile-menu-btn {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(8, 26, 43, 0.4), rgba(8, 26, 43, 0.8)), 
                        url('https://upload.wikimedia.org/wikipedia/commons/ thumb/8/87/Banda_Neira_Island.jpg/1280px-Banda_Neira_Island.jpg') center/cover no-repeat;
            background-image: linear-gradient(to bottom, rgba(8,26,43,0.3) 0%, rgba(8,26,43,0.85) 100%), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80');
        }

        .hero-content {
            max-width: 900px;
            padding: 0 20px;
            z-index: 2;
            animation: fadeIn 1.5s ease-out;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--accent-yellow);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .hero-title {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .hero-desc {
            font-size: 1.2rem;
            color: #d1dfe8;
            margin-bottom: 40px;
            font-weight: 300;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-primary {
            display: inline-block;
            padding: 16px 36px;
            background: linear-gradient(135deg, var(--accent-green), #5a734c);
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            border-radius: 50px;
            transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(125, 150, 109, 0.4);
            background: linear-gradient(135deg, #8ba87a, var(--accent-green));
        }

        /* --- SECTION COMMONS --- */
        section {
            padding: 100px 8%;
            position: relative;
        }

        .section-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .section-tag {
            color: var(--accent-yellow);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }

        .section-title {
            font-size: 3.5rem;
            font-weight: 600;
            line-height: 1.2;
            color: var(--text-light);
        }

        .section-divider {
            width: 70px;
            height: 2px;
            background: var(--accent-yellow);
            margin: 20px auto 0;
        }

        /* --- ABOUT US --- */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-text h3 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--accent-yellow);
        }

        .about-text p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 1.05rem;
            font-weight: 300;
        }

        .about-img-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }

        .about-img-container img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
            transition: var(--transition);
        }

        .about-img-container:hover img {
            transform: scale(1.05);
        }

        /* --- DESTINATIONS --- */
        .destinations {
            background-color: var(--primary-navy);
        }

        .destinations-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .dest-card {
            background: var(--deep-teal);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .dest-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-color: rgba(240, 171, 0, 0.4);
        }

        .dest-img-wrapper {
            position: relative;
            height: 380px;
            overflow: hidden;
            margin: 15px;
            border-radius: 16px;
        }

        .dest-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .dest-card:hover .dest-img-wrapper img {
            transform: scale(1.1);
        }

        .dest-content {
            padding: 20px 25px 30px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .dest-title {
            font-size: 2rem;
            margin-bottom: 12px;
            color: var(--text-light);
        }

        .dest-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.6;
        }

        /* --- PACKAGES --- */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .pkg-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            backdrop-filter: blur(10px);
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .pkg-card.featured {
            border-color: var(--accent-yellow);
            background: rgba(13, 39, 64, 0.9);
            transform: scale(1.03);
        }

        .pkg-card.featured::before {
            content: 'MOST POPULAR';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-yellow);
            color: var(--deep-teal);
            padding: 4px 15px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 20px;
            letter-spacing: 1.5px;
        }

        .pkg-card:hover {
            transform: translateY(-8px);
            border-color: var(--soft-aqua);
        }

        .pkg-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 25px;
            margin-bottom: 25px;
            text-align: center;
        }

        .pkg-type {
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: var(--text-light);
        }

        .pkg-price {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .pkg-price span {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-yellow);
            display: block;
            margin-top: 5px;
            font-family: 'Cormorant Garamond', serif;
        }

        .pkg-features {
            list-style: none;
            margin-bottom: 35px;
            flex-grow: 1;
        }

        .pkg-features li {
            margin-bottom: 12px;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pkg-features li i {
            color: var(--accent-green);
            font-size: 0.8rem;
        }

        .btn-pkg {
            display: block;
            text-align: center;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: 1px solid var(--soft-aqua);
            color: var(--text-light);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            transition: var(--transition);
        }

        .pkg-card.featured .btn-pkg,
        .btn-pkg:hover {
            background: var(--accent-yellow);
            color: var(--deep-teal);
            border-color: var(--accent-yellow);
        }

        /* --- SERVICES --- */
        .services {
            background-color: var(--primary-navy);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .service-box {
            padding: 35px 25px;
            background: var(--deep-teal);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            text-align: center;
        }

        .service-box:hover {
            transform: translateY(-5px);
            border-color: var(--accent-green);
        }

        .service-icon {
            font-size: 2.2rem;
            color: var(--accent-green);
            margin-bottom: 20px;
        }

        .service-title {
            font-size: 1.4rem;
            margin-bottom: 12px;
            color: var(--text-light);
        }

        .service-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        /* --- ITINERARY --- */
        .itinerary-timeline {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .itinerary-timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--soft-aqua);
        }

        .itinerary-day {
            position: relative;
            padding-left: 60px;
            margin-bottom: 40px;
        }

        .day-badge {
            position: absolute;
            left: 0;
            top: 0;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent-yellow);
            color: var(--deep-teal);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(240, 171, 0, 0.4);
        }

        .day-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px 30px;
            border-radius: 16px;
        }

        .day-title {
            font-size: 1.8rem;
            color: var(--accent-yellow);
            margin-bottom: 10px;
        }

        .day-details {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* --- TRAVEL INFO --- */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .info-card {
            background: var(--primary-navy);
            padding: 30px;
            border-radius: 16px;
            border-left: 4px solid var(--accent-green);
        }

        .info-card h4 {
            font-size: 1.5rem;
            color: var(--text-light);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card h4 i {
            color: var(--accent-yellow);

        }

        .info-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- CONTACT & FOOTER --- */
        .contact-section {
            background: linear-gradient(to top, #040d16, var(--deep-teal));
            border-top: 1px solid var(--border-color);
        }

        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        .contact-info p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        .contact-methods {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--primary-navy);
            padding: 20px 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .contact-item:hover {
            border-color: var(--accent-yellow);
        }

        .contact-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(240, 171, 0, 0.1);
            color: var(--accent-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .contact-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .contact-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .cta-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-wa {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #25d366;
            color: #fff;
            padding: 16px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: var(--transition);
        }

        .btn-wa:hover {
            background: #1eb857;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }

        .footer-bottom {
            margin-top: 80px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 992px) {
            .destinations-grid,
            .packages-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .about-grid,
            .contact-container {
                grid-template-columns: 1fr;
            }

            .hero-title {
                font-size: 3.8rem;
            }

            .pkg-card.featured {
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 5%;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                height: 100vh;
                backgro
